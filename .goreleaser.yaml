version: 2
project_name: codrao
builds:
  - main: ./cmd/codrao
    id: "codrao"
    binary: codrao
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
    ldflags:
      - -X github.com/SSOHEB/codrao/cmd/codrao/cmd.version={{.Version}} -X github.com/SSOHEB/codrao/cmd/codrao/cmd.commit={{.Commit}} -X github.com/SSOHEB/codrao/cmd/codrao/cmd.date={{.Date}}

archives:
  - formats: ["tar.gz"]
    name_template: "CODRAO_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Documentation
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 2
    - title: Testing
      regexp: "^.*test[(\\w)]*:+.*$"
      order: 3
    - title: Others
      order: 999

