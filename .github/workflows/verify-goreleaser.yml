name: Verify GoReleaser

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x' # Actually the project uses 1.24 according to go.mod, let's just use stable
          cache: true

      - name: Run GoReleaser Check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check

      - name: Run GoReleaser Release Snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
      
      - name: Verify outputs
        run: |
          echo "Listing dist/ directory..."
          ls -la dist/
          echo "Finding all files in dist/..."
          find dist -type f
          echo "Verifying version string via Linux binary..."
          ./dist/specforge_linux_amd64_v1/specforge version
