name: Bug Report
description: Create a report to help us improve Codrao
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this bug report!"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. With configuration '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: A clear and concise description of what you expected to happen vs what actually happened.
    validations:
      required: true
  - type: input
    id: codrao-version
    attributes:
      label: Codrao Version
      placeholder: e.g. v1.0.0 or commit hash
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go Version
      placeholder: e.g. 1.24
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows, macOS, Linux
    validations:
      required: true
